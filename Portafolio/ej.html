<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modal Demo</title>
  <style>
    body {
      font-family: sans-serif;
    }

    /* Modal fondo */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }

    .modal.modal-active {
      display: flex;
    }

    /* Contenido del modal */
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      position: relative;
    }

    .btn-close {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 20px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .btn-open {
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <button class="btn-open" onclick="openModal('miModal')">Abrir Modal</button>

  <!-- Modal -->
  <div class="modal" id="miModal" onclick="closeModalOutside(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="btn-close" onclick="closeModal('miModal')">✖</button>
      <h2>Hola!</h2>
      <p>Este es un modal funcional.</p>
    </div>
  </div>

  <script>
    function openModal(id) {
      document.getElementById(id).classList.add('modal-active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('modal-active');
    }

    function closeModalOutside(event) {
      if (event.target.classList.contains('modal')) {
        event.target.classList.remove('modal-active');
      }
    }
  </script>
</body>
</html>
